<div class="page" id="approvalPage">

    <div class="card">

        <!-- HEADER -->
        <div class="card-header">
            <h2>Approval Dashboard</h2>
            <div class="sub" id="approvalSub">
                Visits pending your review
            </div>
        </div>


        <!-- FILTER BAR -->
        <div class="filter-bar" id="approvalFilterBar">

            <div class="fitem">

                <label>From Date</label>

                <input type="date" id="approvalFrom" onchange="renderApprovalDashboard()">

            </div>


            <div class="fitem">

                <label>To Date</label>

                <input type="date" id="approvalTo" onchange="renderApprovalDashboard()">

            </div>


            <div class="fitem">

                <button class="secondary small" type="button" onclick="clearApprovalFilters()">
                    Clear Filters
                </button>

            </div>

        </div>


        <!-- CLIENT DETAILS -->
        <div class="section client-detail-card" id="clientDetailSection" style="display:none;">

            <div class="section-title">
                Client Details
            </div>

            <div class="grid" id="clientDetailGrid"></div>

        </div>


        <!-- APPROVAL TABLE -->
        <div class="section" id="approvalSection">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Executive</th>
                            <th>Branch</th>
                            <th>Client</th>
                            <th>Visit Type</th>
                            <th>Visit Date</th>
                            <th>Purpose / Status</th>
                            <th>Photo</th>

                            <th>Sales (gm)</th>
                            <th>Submitted</th>

                            <th>Details</th>
                            <th>Action</th>

            </div>


            <div class="empty-state" id="approvalEmpty" style="display:none;">

            </div>

        </div>

    </div>

</div>

<script>

    function toggleDVRDetails(name, button) {

        if (!name || !button) return;

        const detailsRow =
            document.getElementById(`dvr-details-row-${name}`);

        const detailsBox =
            document.getElementById(`dvr-details-${name}`);

        if (!detailsRow || !detailsBox) return;


        /* =========================
           CLOSE
        ========================= */

        if (detailsRow.classList.contains("show")) {

            detailsRow.classList.remove("show");

            button.innerHTML = "▼ View Details";

            return;
        }


        /* =========================
           OPEN
        ========================= */

        detailsRow.classList.add("show");

        button.innerHTML = "▲ Hide Details";


        /* =========================
           ALREADY LOADED
        ========================= */

        if (detailsBox.dataset.loaded === "1") {
            return;
        }


        detailsBox.innerHTML = `
        <div class="details-loading">
            Loading details...
        </div>
    `;


        fetch(
            `/api/method/crm_custom_001.api.dvr.get_sub_leads_by_parent?parent_lead_id=${encodeURIComponent(name)}`,
            {
                method: "GET",
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                }
            }
        )

            .then(response => {

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                return response.json();
            })

            .then(data => {

                console.log("DVR Details API:", data);

                const rows = data.message || [];


                /* =========================
                   NO DATA
                ========================= */

                if (!Array.isArray(rows) || rows.length === 0) {

                    detailsBox.innerHTML = `
                <div class="details-error">
                    No Sub Lead details found.
                </div>
            `;

                    return;
                }


                detailsBox.dataset.loaded = "1";


                /* =========================
                   TABLE
                ========================= */

                detailsBox.innerHTML = `

            <div class="details-header">

                <div class="details-title">
                    <span class="details-title-icon">ℹ</span>
                    Sub Lead Details
                </div>

                <div class="details-count">
                    ${rows.length}
                    Record${rows.length > 1 ? "s" : ""}
                </div>

            </div>


            <div class="sub-lead-table-wrapper">

                <table class="sub-lead-table">

                    <thead>

                        <tr>

                            <th class="col-sr">#</th>

                            <th class="col-name">
                                Sub Lead
                            </th>

                            <th class="col-purpose">
                                Purpose
                            </th>

                            <th class="col-status">
                                Status
                            </th>

                            <th class="col-date">
                                Next Visit Date
                            </th>

                            <th class="col-selection">
                                Selection Made
                            </th>

                            <th class="col-discussion">
                                Discussion
                            </th>

                            <th class="col-products">
                                Products Pitched
                            </th>

                            <th class="col-photo">
                                Visit Photo
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${rows.map((row, index) => `

                            <tr>

                                <!-- SR -->

                                <td class="col-sr">
                                    ${index + 1}
                                </td>


                                <!-- SUB LEAD -->

                                <td class="col-name">

                                    <div class="sub-lead-name-cell">

                                        <strong>
                                            ${escapeHtml(row.name || "-")}
                                        </strong>

                                    </div>

                                </td>


                                <!-- PURPOSE -->

                                <td class="col-purpose">

                                    <div class="table-text">
                                        ${escapeHtml(
                    row.purpose || "-"
                )}
                                    </div>

                                </td>


                                <!-- STATUS -->

                                <td class="col-status">

                                    <span class="status-badge">
                                        ${escapeHtml(
                    row.status || "-"
                )}
                                    </span>

                                </td>


                                <!-- NEXT VISIT -->

                                <td class="col-date">

                                    ${escapeHtml(
                    row.next_visit_date || "-"
                )}

                                </td>


                                <!-- SELECTION -->

                                <td class="col-selection">

                                    ${escapeHtml(
                    row.selection_made || "-"
                )}

                                </td>


                                <!-- DISCUSSION -->

                                <td class="col-discussion">

                                    <div class="table-text wrap-text">

                                        ${escapeHtml(
                    row.discussion || "-"
                )}

                                    </div>

                                </td>


                                <!-- PRODUCTS -->

                                <td class="col-products">

                                    <div class="table-text wrap-text">

                                        ${escapeHtml(
                    row.products_pitched || "-"
                )}

                                    </div>

                                </td>


                                <!-- PHOTO -->

                                <td class="col-photo">

                                    ${row.visit_photo

                        ? `
                                            <button
                                                type="button"
                                                class="detail-photo"
                                                onclick="openDVRPhoto('${escapeHtml(row.visit_photo)}')"
                                            >
                                                🖼 View
                                            </button>
                                        `

                        : `
                                            <span class="no-photo">
                                                -
                                            </span>
                                        `
                    }

                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        `;
            })

            .catch(error => {

                console.error(
                    "DVR Details API Error:",
                    error
                );

                detailsBox.innerHTML = `
            <div class="details-error">
                Failed to load DVR details.
            </div>
        `;

            });
    }

    let dvrData = [];

    function loadDVRData() {

        fetch("/api/method/crm_custom_001.api.dvr.get_dvr_for_approval_new_client", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                return response.json();

            })
            .then(data => {

                console.log("DVR API Response:", data);

                dvrData = data.message || [];

                console.log("Live DVR Data:", dvrData);

                renderApprovalDashboard();

            })
            .catch(error => {

                console.error("DVR API Error:", error);

                dvrData = [];

                renderApprovalDashboard();

            });

    }


    /* =========================================================
       PAGE LOAD
    ========================================================= */

    document.addEventListener("DOMContentLoaded", function () {
        loadDVRData();
    });


    /* =========================================================
       RENDER APPROVAL DASHBOARD
    ========================================================= */

    function renderApprovalDashboard() {

        const tbody = document.getElementById("approvalTable");
        const empty = document.getElementById("approvalEmpty");

        if (!tbody) return;

        let data = [...dvrData];

        const fromDate =
            document.getElementById("approvalFrom")?.value || "";

        const toDate =
            document.getElementById("approvalTo")?.value || "";


        if (fromDate) {

            data = data.filter(row => {

                if (!row.visit_date) return false;

                const visitDate =
                    String(row.visit_date).substring(0, 10);

                return visitDate >= fromDate;

            });

        }


        if (toDate) {

            data = data.filter(row => {

                if (!row.visit_date) return false;

                const visitDate =
                    String(row.visit_date).substring(0, 10);

                return visitDate <= toDate;

            });

        }


        tbody.innerHTML = "";


        if (!data.length) {

            empty.style.display = "block";

            return;

        }


        empty.style.display = "none";


        data.forEach(row => {

            const tr = document.createElement("tr");

            const isNewClient =
                (row.client_type || "").trim() === "New Client";

            const isEditable =
                isNewClient && row.approval_status !== "Approved";

            const actionCell = isEditable
                ? `
                        <button
                            class="edit-btn"
                            type="button"
                            onclick="editDVR('${escapeHtml(row.name)}')"
                        >
                            ✎ Edit
                        </button>
                    `
                : `<span class="action-empty">-</span>`;


            const detailsCell = isEditable
                ? `
                        <button
                            class="details-btn"
                            type="button"
                            onclick="toggleDVRDetails('${escapeHtml(row.name)}', this)"
                        >
                            ▼ View Details
                        </button>
                    `
                : `<span class="action-empty">-</span>`;
            tr.innerHTML = `
        <td>
            ${escapeHtml(row.sales_person || "-")}
        </td>

        <td>
            ${escapeHtml(row.branch || "-")}
        </td>

        <td>
            ${escapeHtml(
                row.client_type === "New Client"
                    ? row.party_name || "-"
                    : row.client || "-"
            )}
        </td>

        <td>
            ${escapeHtml(row.visit_type || "-")}
        </td>

        <td>
            ${escapeHtml(
                row.visit_date
                    ? String(row.visit_date).substring(0, 10)
                    : "-"
            )}
        </td>

        <td>
            ${escapeHtml(
                row.purpose_status ||
                row.purpose ||
                "-"
            )}
        </td>

        <td>
            ${row.visit_photo
                    ? `
                        <button
                            class="photo-btn"
                            type="button"
                            onclick="viewPhoto('${escapeHtml(row.name)}')"
                        >
                            View Photo
                        </button>
                    `
                    : "-"
                }
        </td>

        

        <td>
            ${escapeHtml(row.sales_gm || "-")}
        </td>

        <td>
            ${escapeHtml(row.creation || "-")}
        </td>

        <td>
            ${escapeHtml(row.client_type || "-")}
        </td>

        <td>
            ${getStatusBadge(row.approval_status)}
        </td>

        <td>
            ${detailsCell}
        </td>

        <td>
            ${actionCell}
        </td>
    `;


            tbody.appendChild(tr);


            /* =================================
               DETAILS ROW
            ================================= */

            const detailsRow = document.createElement("tr");

            detailsRow.className = "dvr-details-row";

            detailsRow.id =
                `dvr-details-row-${row.name}`;


            detailsRow.innerHTML = `
                <td
                    colspan="14"
                    class="dvr-details-wrapper"
                >
                    <div
                        class="dvr-details-card"
                        id="dvr-details-${row.name}"
                    >
                        <div class="details-loading">
                            Loading...
                        </div>
                    </div>
                </td>
            `;

            tbody.appendChild(detailsRow);

        });
    }


    /* =========================================================
       STATUS BADGE
    ========================================================= */

    function getStatusBadge(status) {

        if (status === "Approved") {

            return `
            <span class="status status-approved">
                Approved
            </span>
        `;

        }


        if (status === "Rejected") {

            return `
            <span class="status status-rejected">
                Rejected
            </span>
        `;

        }


        return `
        <span class="status status-pending">
            Pending Approval
        </span>
    `;

    }


    /* =========================================================
       EDIT DVR (New Client rows -> redirect to doctype form)
    ========================================================= */

    async function editDVR(name) {

        if (!name) return;

        try {

            // 1. Parent DVR fetch
            const dvrResponse = await fetch(
                `/api/resource/Daily%20Visit%20Report/${encodeURIComponent(name)}`,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const dvrResult = await dvrResponse.json();

            if (!dvrResponse.ok || !dvrResult.data) {
                throw new Error(
                    dvrResult.exception || "DVR record not found"
                );
            }

            const dvr = dvrResult.data;

            console.log("Parent DVR:", dvr);


            // 2. Data from Parent DVR
            const params = new URLSearchParams();

            params.append("purpose", dvr.purpose || "");
            params.append("status", dvr.status || "");
            params.append("selection_made", dvr.selection_made || "");
            params.append("visit_photo", dvr.visit_photo || "");
            params.append("discussion", dvr.discussion || "");
            params.append("products_pitched", dvr.products_pitched || "");
            params.append("next_visit_date", dvr.next_visit_date || "");

            // Parent DVR name
            params.append(
                "parent_lead_id",
                dvr.parent_lead_id || name
            );

            params.append(
                "amended_from",
                name
            );


            console.log(
                "Creating NEW Sub Lead:",
                Object.fromEntries(params)
            );


            // 3. ALWAYS CREATE NEW SUB LEAD
            const createResponse = await fetch(
                `/api/method/crm_custom_001.api.dvr.create_dvr_record?${params.toString()}`,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const createResult =
                await createResponse.json();

            console.log(
                "Sub Lead Response:",
                createResult
            );


            if (
                !createResponse.ok ||
                !createResult.message
            ) {

                throw new Error(
                    createResult.exception ||
                    createResult.message ||
                    "Sub Lead creation failed"
                );
            }


            // 4. Newly created Sub Lead
            const subLead = createResult.message;

            console.log(
                "New Sub Lead:",
                subLead
            );


            // 5. Open NEW Sub Lead
            window.location.href =
                "/app/sub-lead/" +
                encodeURIComponent(subLead.name);

        }
        catch (error) {

            console.error(
                "Edit DVR Error:",
                error
            );

            alert(
                error.message ||
                "Something went wrong"
            );
        }
    }

    /* =========================================================
       VIEW PHOTO
    ========================================================= */

    function viewPhoto(name) {

        frappe.msgprint(
            `Photo preview for ${name}`
        );

    }


    /* =========================================================
       CLEAR APPROVAL FILTERS
    ========================================================= */

    function clearApprovalFilters() {

        const fromDate =
            document.getElementById("approvalFrom");

        const toDate =
            document.getElementById("approvalTo");


        if (fromDate) {
            fromDate.value = "";
        }

        if (toDate) {
            toDate.value = "";
        }


        renderApprovalDashboard();

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        return String(value)

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>
